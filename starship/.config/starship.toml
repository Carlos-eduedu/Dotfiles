# Studio1804: a compact prompt using the shared semantic terminal palette.
add_newline = false
palette = "studio1804"
format = "$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"

[palettes.studio1804]
text = "#ffffff"
muted = "#9ca3af"
surface = "#1f2937"
inactive = "#374151"
accent = "#f97316"
success = "#22c55e"
warning = "#eab308"
error = "#ef4444"
info = "#38bdf8"

[username]
show_always = false
format = "[$user]($style)@"
style_user = "muted"
style_root = "error bold"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "muted"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "text bold"
read_only = " ro"
read_only_style = "warning"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "
symbol = "git:"
style = "accent"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "warning"
conflicted = "!${count}"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕${ahead_count}/${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "-${count}"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "muted"

[character]
success_symbol = "[›](accent bold)"
error_symbol = "[›](error bold)"
vimcmd_symbol = "[‹](info bold)"
