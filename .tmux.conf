# ~/.tmux.conf

# Base -----------------------------------------------------------------------
set -sg escape-time 0
set -g history-limit 50000
set -g mouse on
set -g focus-events on
setw -g aggressive-resize on

set -g base-index 1
setw -g pane-base-index 1

# Cores ----------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,tmux-256color:RGB"

# Prefix ---------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Janelas e painéis ----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode ------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Status bar: base ------------------------------------------------------------
set -g status-interval 15
set -g status-left-length 40
set -g status-right-length 120

# Status bar: colors ----------------------------------------------------------
set -g status-style "bg=#000000,fg=#9ca3af"
set -g status-left-style "fg=#ffffff,bold"
set -g status-right-style "fg=#9ca3af"
set -g window-status-current-style "fg=#f97316,bold"
set -g pane-border-style "fg=#374151"
set -g pane-active-border-style "fg=#f97316"
set -g message-style "bg=#374151,fg=#ffffff"
set -g @status_fg_muted "#9ca3af"
set -g @status_fg_warning "#f97316"
set -g @status_reset "#[default]"

# Status bar: separators ------------------------------------------------------
set -g @status_separator " "

# Status bar: left side -------------------------------------------------------
set -g status-left "#[fg=#{@status_fg_muted}] #S #{@status_reset}"

# Status bar: right side modules ---------------------------------------------
set -g @status_module_prefix "#{prefix_highlight}"
set -g @status_module_ssh "#{?#{pane_ssh_connected},#[fg=#{@status_fg_warning}]#{pane_ssh_connect} #{@status_reset},}"
set -g @status_module_workspace "#[fg=#{@status_fg_muted}]#{workspace_usage}#{@status_reset}"
set -g @status_module_github "#[fg=#{@status_fg_muted}]#{tmux_gh_uname}#{@status_reset}"
set -g @status_module_datetime "#[fg=#{@status_fg_muted}]%a %h-%d %H:%M#{@status_reset}"

# Status bar: right side composition -----------------------------------------
# Keep plugin placeholders directly here; some plugins only rewrite status-right.
set -g status-right "#{prefix_highlight}#{?#{pane_ssh_connected},#[fg=#{@status_fg_warning}]#{pane_ssh_connect} #{@status_reset},}#[fg=#{@status_fg_muted}]#{workspace_usage}#{@status_reset} #[fg=#{@status_fg_muted}]#{tmux_gh_uname}#{@status_reset} #[fg=#{@status_fg_muted}]%a %h-%d %H:%M#{@status_reset} "

set -g @prefix_highlight_fg '#000000'
set -g @prefix_highlight_bg '#f97316'
set -g @prefix_highlight_prefix_prompt 'PREFIX'
set -g @prefix_highlight_output_prefix ' '
set -g @prefix_highlight_output_suffix ' '

# GitHub account -------------------------------------------------------------
set -g @tmux_gh_icon 'gh'
set -g @tmux_gh_default_uname ''

# Workspace usage ------------------------------------------------------------
set -g @workspace_usage_processes 'tmux|zsh|nvim|node|python|go|cargo'
set -g @workspace_usage_mem 'on'
set -g @workspace_usage_cpu 'on'
set -g @workspace_usage_interval_delay 0

# Grimoire -------------------------------------------------------------------
set -g @grimoire-key 'f'
set -g @ephemeral-grimoire-key 'F'
set -g @grimoire-kill-key 'C'
set -g @grimoire-logo-key 'B'
set -g @grimoire-color '#f97316'
set -g @grimoire-width '80%'
set -g @grimoire-height '30%'
set -g @grimoire-position 'bottom-center'
set -g @grimoire-osc52 'off'

# Notifications --------------------------------------------------------------
set -g @tnotify-verbose 'on'
set -g @tnotify-sleep-duration '10'

# Window names ---------------------------------------------------------------
set -g @tmux_window_name_shells "['bash', 'fish', 'sh', 'zsh']"
set -g @tmux_window_dir_programs "['nvim', 'vim', 'vi', 'git']"
set -g @tmux_window_name_max_name_len "28"
set -g @tmux_window_name_icon_style "'name'"
set -g @tmux_window_name_show_program_args "False"
set -g @tmux_window_name_ignore_program_diffs "True"

# Plugins opcionais ----------------------------------------------------------
# Mantidos se o TPM já estiver instalado; o tmux continua limpo sem eles.
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tardunge/tmux-gh'
set -g @plugin 'sjdonado/tmux-workspace-usage'
set -g @plugin 'tony-sol/tmux-current-pane-hostname'
set -g @plugin 'navahas/tmux-grimoire'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'tmux-plugins/tpm'

if-shell '[ -x ~/.tmux/plugins/tmux-window-name/tmux_window_name.tmux ]' 'run ~/.tmux/plugins/tmux-window-name/tmux_window_name.tmux'
if-shell '[ -x ~/.tmux/plugins/tmux-prefix-highlight/prefix_highlight.tmux ]' 'run ~/.tmux/plugins/tmux-prefix-highlight/prefix_highlight.tmux'
if-shell '[ -x ~/.tmux/plugins/tmux-gh/tmux_gh.tmux ]' 'run ~/.tmux/plugins/tmux-gh/tmux_gh.tmux'
if-shell '[ -x ~/.tmux/plugins/tmux-workspace-usage/workspace_usage.tmux ]' 'run ~/.tmux/plugins/tmux-workspace-usage/workspace_usage.tmux'
if-shell '[ -x ~/.tmux/plugins/tmux-current-pane-hostname/current_pane_hostname.tmux ]' 'run ~/.tmux/plugins/tmux-current-pane-hostname/current_pane_hostname.tmux'
if-shell '[ -x ~/.tmux/plugins/tmux-grimoire/grimoire.tmux ]' 'run ~/.tmux/plugins/tmux-grimoire/grimoire.tmux'
if-shell '[ -x ~/.tmux/plugins/tmux-notify/tnotify.tmux ]' 'run ~/.tmux/plugins/tmux-notify/tnotify.tmux'
if-shell '[ -f ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
