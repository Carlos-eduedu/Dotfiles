# ~/.tmux.conf

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Keep the modern 10 ms default: responsive without misreading escape sequences.
set -sg escape-time 10

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Enable clipboard integration via OSC 52 (ghostty will catch this natively)
set -g set-clipboard on

# Allow escape sequences to pass through to terminal (images, hyperlinks, etc.)
set -g allow-passthrough on

# Enable extended keys support (Ctrl+Shift combos, etc.)
set -g extended-keys on

# Renumber windows when one is closed
set -g renumber-windows on

# Sync window title with terminal (Ghostty will pick this up)
set -g set-titles on
set -g set-titles-string '#S / #W'

# Use tmux's modern terminfo entry inside panes. Ghostty advertises
# truecolor in its own terminfo; this explicit match covers it in tmux too.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Avoid resize churn and shell redraws when sessions have multiple clients.
setw -g aggressive-resize off

# ============================================
# KEY BINDINGS
# ============================================

# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation after the prefix.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Without the prefix, tmux handles navigation in shells and forwards the keys
# to Neovim. Neovim crosses back into tmux when it reaches an editor edge.
bind -n C-h if-shell -F '#{m/r:^(n?vim|view)$,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell -F '#{m/r:^(n?vim|view)$,#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell -F '#{m/r:^(n?vim|view)$,#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell -F '#{m/r:^(n?vim|view)$,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# APPEARANCE
# ============================================

# Status bar position
set -g status-position bottom

# Studio1804 palette: bg #000000, surface #1f2937, text #ffffff,
# muted #9ca3af, inactive #374151, accent #f97316.
set -g status-style 'bg=#000000 fg=#9ca3af'
set -g status-left-length 24
set -g status-right-length 12

# Keep permanent status content limited to session, windows and time.
set -g status-left '#[fg=#f97316,bold] #S #[fg=#374151]│'
set -g status-right '#[fg=#374151]│ #[fg=#9ca3af]%H:%M '

# Window status
setw -g window-status-format ' #[fg=#9ca3af]#I:#W '
setw -g window-status-current-format ' #[fg=#f97316,bold]#I:#W '

# Window activity / bell styling
setw -g window-status-activity-style 'fg=#fb923c bold'   # orange-400
setw -g window-status-bell-style 'fg=#ef4444 bold'       # red-400

# Pane border colors
set -g pane-border-style 'fg=#374151'
set -g pane-active-border-style 'fg=#f97316'

# Pane scrollbars — show scrollback position (tmux 3.6+)
# set -g pane-scrollbars on
# set -g pane-scrollbars-position right

# Message styling
set -g message-style 'bg=#f97316 fg=#000000 bold'

# Copy mode styling (matches studio1804-modern selection colors)
setw -g mode-style 'bg=#374151 fg=#ffffff bold'

# Cursor style inside tmux (matches Ghostty bar cursor)
set -g cursor-style bar

# Clock mode styling
setw -g clock-mode-colour '#f97316'
setw -g clock-mode-style 24

# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
# pbcopy fallback for macOS; with set-clipboard on, ghostty also captures via OSC 52
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux

# ============================================
# PLUGINS (via TPM)
# ============================================

# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
